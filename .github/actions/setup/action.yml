# The toolchain BendKV builds with: bun, clang 19 (Ubuntu 24.04's), and
# Bend at 1cce499 with the patches of bend-patches/ applied, in
# ~/bend-patched (kept in the cache while the patches stay the same).
# $BEND is set to the patched compiler for the steps after it.
name: BendKV toolchain
description: bun, clang 19 and the patched Bend
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: clang 19
      shell: bash
      run: |
        if ! command -v clang-19 > /dev/null; then
          sudo apt-get update -q
          sudo apt-get install -yq clang-19
        fi
        clang-19 --version | head -1
    - id: bend
      uses: actions/cache@v4
      with:
        path: ~/bend-patched
        key: bend-1cce499-${{ hashFiles('bend-patches/**') }}
    - name: Bend with the patches
      if: steps.bend.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone -q https://github.com/bendlang/bend ~/bend-patched
        sh bend-patches/apply.sh ~/bend-patched
    - shell: bash
      run: echo "BEND=bun $HOME/bend-patched/bend2/main.ts" >> "$GITHUB_ENV"
