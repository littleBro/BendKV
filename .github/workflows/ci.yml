# CI: what CONTRIBUTING.md asks of a change before it is merged, on every
# pull request and every push to main. The proofs
# (make check, then make verdict in the BendTT kernel), the generated
# blocks (make gencheck) and the pure checks (make smoke) in one job; the
# server built once (make build), then tested against Redis 7.0.15
# (make test) and counted under callgrind (make perfcheck) in two jobs
# side by side. Redis 7.0.15 is the one Ubuntu 24.04 ships, the reference
# the tests compare with. The test suites of client libraries (redis-py in
# RESP2 and in RESP3, go-redis) run against Redis 7.0.15 and the server
# built, in three more jobs (tools/client_suite.py): a test Redis passes
# that BendKV fails, and that is not among the known failures of
# tools/data/clients.json, fails the job. The server is also built with
# the sanitizers, in one more job (tools/sanitize.sh): a report fails it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: proofs (check, verdict, gencheck, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # make verdict rechecks the proofs in the BendTT kernel, which the
      # compiler builds once with Lean 4.34.0 into ~/.bend/bendtt; kept
      # in the cache, Lean is needed only when the patches change
      - id: kernel
        uses: actions/cache@v4
        with:
          path: ~/.bend/bendtt
          key: bendtt-${{ hashFiles('bend-patches/**') }}
      # (elan fetches a toolchain at its first use; the compiler looks for
      # it in elan's directory, so it is fetched here). elan is installed by
      # the elan-init of its release v4.2.4, checked against the sha256 of
      # that release's asset, not by the script of elan's master branch,
      # which fetches whatever elan is latest and checks nothing
      - name: Lean 4.34.0
        if: steps.kernel.outputs.cache-hit != 'true'
        env:
          ELAN_URL: https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz "$ELAN_URL"
          echo "$ELAN_SHA256  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          ~/.elan/bin/elan toolchain install leanprover/lean4:v4.34.0
          ~/.elan/toolchains/leanprover--lean4---v4.34.0/bin/lean --version
      - name: make gencheck
        run: make gencheck
      - name: make check
        run: make check BEND="$BEND"
      - name: make verdict
        run: make verdict BEND="$BEND"
      - name: make smoke
        run: make smoke BEND="$BEND"

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: make build
        run: make build BEND="$BEND"
      - uses: actions/upload-artifact@v4
        with:
          name: bendkv
          path: build/bendkv
          retention-days: 7

  test:
    name: test (against Redis 7.0.15)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # the float test compiles its checks with Bend, and the tests build
      # a shim and a reference with the C compiler
      - uses: ./.github/actions/setup
      - name: Redis 7.0.15
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq redis-server redis-tools
          sudo systemctl stop redis-server || true
          redis-server --version
          redis-server --version | grep -q 'v=7\.0\.15 '
      - uses: actions/download-artifact@v4
        with:
          name: bendkv
          path: build
      # the server as built, newer than its sources, so that nothing
      # builds it again
      - run: chmod +x build/bendkv && touch build/bendkv
      - name: make test
        run: CC=clang-19 PORT=6380 REDIS_PORT=6390 sh tests/run_tests.sh
      - name: the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/*.log
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  perf:
    name: perfcheck (instructions per request)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: valgrind and redis-benchmark
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq valgrind redis-tools
      - uses: actions/download-artifact@v4
        with:
          name: bendkv
          path: build
      - run: chmod +x build/bendkv
      - name: make perfcheck
        run: sh tools/perf_guard.sh build/bendkv

  clients:
    name: clients (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: redis-py RESP2, client: redis-py, protocol: 2 }
          - { suite: redis-py RESP3, client: redis-py, protocol: 3 }
          - { suite: go-redis, client: go-redis, protocol: 3 }
    steps:
      - uses: actions/checkout@v4
      - name: Redis 7.0.15
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq redis-server redis-tools
          sudo systemctl stop redis-server || true
          redis-server --version | grep -q 'v=7\.0\.15 '
      - if: matrix.client == 'redis-py'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.client == 'go-redis'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: bendkv
          path: build
      - run: chmod +x build/bendkv
      - name: the suite against Redis 7.0.15 and BendKV
        run: >-
          python3 tools/client_suite.py ci --client ${{ matrix.client }}
          --protocol ${{ matrix.protocol }} --server build/bendkv --out build/clients
      - name: the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clients-${{ matrix.client }}-resp${{ matrix.protocol }}
          path: build/clients
          if-no-files-found: ignore
          retention-days: 7

  # the server's C built with AddressSanitizer and UndefinedBehaviorSanitizer
  # (the Bend heap poisoned, bend-patches/heap-asan.patch), and with
  # ThreadSanitizer, each serving the tests that stress its memory and its
  # writer thread most (tools/sanitize.sh): a report fails the job
  sanitize:
    name: sanitize (ASan and UBSan, TSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # clang 19's sanitizer runtimes and llvm-symbolizer, which Ubuntu
      # ships apart from clang-19, and Redis 7.0.15 for the tests that
      # compare; the sanitizers' shadow memory needs mappings placed with
      # at most 28 random bits (vm.mmap_rnd_bits), which a runner's kernel
      # may set higher
      - name: the sanitizers and Redis 7.0.15
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libclang-rt-19-dev llvm-19 redis-server redis-tools
          sudo systemctl stop redis-server || true
          redis-server --version | grep -q 'v=7\.0\.15 '
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: tools/sanitize.sh
        run: CC=clang-19 PORT=6380 REDIS_PORT=6390 sh tools/sanitize.sh
      - name: the reports and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitize-logs
          path: |
            build/sanitize
            build/*.log
          if-no-files-found: ignore
          retention-days: 7
